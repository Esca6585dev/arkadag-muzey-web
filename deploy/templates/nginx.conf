# Arkadag City Museum - installed by deploy/setup.sh (placeholders @...@ are filled in there).
# Edits here are overwritten the next time setup.sh runs; change the template instead.

upstream museum_web {
    server 127.0.0.1:@WEB_PORT@;
    keepalive 16;
}

upstream museum_api {
    server 127.0.0.1:@API_PORT@;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@ www.@DOMAIN@;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://@DOMAIN@$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.@DOMAIN@;

    ssl_certificate     @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;

    return 301 https://@DOMAIN@$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @DOMAIN@;

    ssl_certificate     @SSL_CERT@;
    ssl_certificate_key @SSL_KEY@;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:museum_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/@DOMAIN@.access.log;
    error_log  /var/log/nginx/@DOMAIN@.error.log;

    client_max_body_size @MAX_BODY_MB@m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (not append) so clients cannot spoof their IP for the API's rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Old Joomla URLs -> new site (keeps bookmarks and search results working) ---
    # Articles: /[index.php/]tk/news-articles-tm/123-alias -> /tk/news/<slug> (looked up by the API)
    location ~ ^/(?:index\.php/)?(?<old_lang>tk|ru|en)/news-articles-(?:tm|ru|en)/(?<old_id>\d+)[^/]*/?$ {
        proxy_pass http://museum_api/api/v1/public/legacy/article?id=$old_id&lang=$old_lang;
    }
    location ~ ^/(?:index\.php/)?(?<old_lang>tk|ru|en)/news-articles-(?:tm|ru|en)/?$ {
        return 301 /$old_lang/news;
    }
    location ~ ^/(?:index\.php/)?(?<old_lang>tk|ru|en)/museum-sections-(?:tm|ru|en)/?$ {
        return 301 /$old_lang/halls;
    }
    location ~ ^/(?:index\.php/)?(?<old_lang>tk|ru|en)/about-museum-(?:tm|ru|en)/?$ {
        return 301 /$old_lang/about;
    }
    location ~ ^/(?:index\.php/)?(?<old_lang>tk|ru|en)/contact-(?:tm|ru|en)/?$ {
        return 301 /$old_lang/contact;
    }
    location ~ ^/(?:index\.php/)?(?:tk|ru|en)/virtualnyj-muzej-(?:tm|ru|en)/?$ {
        return 301 https://virtualmuseum.gov.tm/;
    }
    location ~ ^/(?:index\.php/)?(?<old_lang>tk|ru|en)/(?:home-[a-z0-9-]+|glavnaya)/?$ {
        return 301 /$old_lang;
    }
    # Non-SEF links: /index.php?option=com_content&view=article&id=123&lang=tk
    location = /index.php {
        if ($arg_view = "article") {
            rewrite ^ /api/v1/public/legacy/article?id=$arg_id&lang=$arg_lang? last;
        }
        return 301 /;
    }
    location ~ ^/index\.php(/.*)$ {
        return 301 $1;
    }
    # Images were copied to uploads/legacy by the importer.
    location /images/ {
        rewrite ^/images/(.*)$ /uploads/legacy/images/$1 permanent;
    }
    location ~* \.php$ {
        return 404;
    }

    location /api/ {
        proxy_pass http://museum_api;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        alias @APP_DIR@/backend/uploads/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        # Uploaded files are data, never active content (blocks scripts in uploaded SVG/HTML).
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    location /_next/static/ {
        proxy_pass http://museum_web;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://museum_web;
        proxy_read_timeout 60s;
    }
}
